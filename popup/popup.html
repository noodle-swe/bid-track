<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bid Track</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Bid Track</h1>
    <div id="account" class="account hidden">
      <span id="username"></span>
      <span aria-hidden="true">·</span>
      <button id="open-settings" class="link" type="button">Settings</button>
      <span id="settings-sep" aria-hidden="true">·</span>
      <button id="logout" class="link" type="button">Log out</button>
    </div>
  </header>

  <section id="auth" class="hidden">
    <p id="auth-notice" class="notice hidden" role="status"></p>
    <form id="auth-form" class="form">
      <label for="username-input">Username</label>
      <input id="username-input" type="text" required autocomplete="username" spellcheck="false"
        pattern="[A-Za-z0-9._\-]{3,40}" title="3–40 characters: letters, numbers, . _ -" />
      <label for="password-input">Password</label>
      <input id="password-input" type="password" required minlength="8" autocomplete="current-password" />
      <label for="invite-input">Invite code <span class="muted">(first time only)</span></label>
      <input id="invite-input" type="text" autocomplete="off" spellcheck="false" />
      <button id="auth-submit" class="btn primary" type="submit">Log in</button>
    </form>
    <p id="auth-error" class="error hidden" role="alert"></p>
  </section>

  <section id="main" class="hidden">
    <button id="upload" class="btn primary" type="button">Capture step 1</button>
    <p id="job" class="job hidden"></p>
    <p id="result" class="result hidden" role="status"></p>
  </section>

  <section id="settings" class="hidden">
    <button id="close-settings" class="link back" type="button">← Back</button>

    <h2>Account</h2>
    <p class="setting-row">Username <span id="settings-username" class="value"></span></p>
    <form id="password-form" class="form">
      <label for="current-password">Current password</label>
      <input id="current-password" type="password" required autocomplete="current-password" />
      <label for="new-password">New password <span class="muted">(at least 8 characters)</span></label>
      <input id="new-password" type="password" required minlength="8" autocomplete="new-password" />
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" />
      <button id="password-submit" class="btn primary" type="submit">Save password</button>
    </form>
    <p id="password-result" class="result hidden" role="status"></p>

    <h2>Shortcut</h2>
    <p class="setting-row">Capture <span id="shortcut" class="value"></span></p>
    <button id="change-shortcut" class="btn" type="button">Change shortcut</button>

    <h2>Downloads</h2>
    <label class="check">
      <input id="auto-download" type="checkbox" />
      Automatically download the screenshots to local
    </label>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
